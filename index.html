<script type="module">
const V="10.12.2";
const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

/* === Configuración del proyecto Firebase de Volkine === */
const firebaseConfig=window.VOLKINE_FIREBASE_CONFIG;

const app=initializeApp(firebaseConfig);
const auth=A.getAuth(app);
let fs;
try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
catch(e){fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true})}

/* ---- Adaptador: misma forma que la base de datos de Claude ---- */
const clean=d=>JSON.parse(JSON.stringify(d??{}));
const wrapSnapDocs=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:s.metadata.fromCache}});
function wDoc(path){return{path,
  collection:n=>wCol(path+"/"+n),
  get:async()=>{const s=await F.getDoc(F.doc(fs,path));return{id:s.id,exists:s.exists(),data:()=>s.data()}},
  set:d=>F.setDoc(F.doc(fs,path),clean(d)),
  delete:()=>F.deleteDoc(F.doc(fs,path)),
  onSnapshot:(ok,ko)=>F.onSnapshot(F.doc(fs,path),{includeMetadataChanges:true},s=>ok({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:{fromCache:s.metadata.fromCache}}),ko)}}
function wCol(path){return{path,
  doc:id=>wDoc(path+"/"+id),
  get:async()=>wrapSnapDocs(await F.getDocs(F.collection(fs,path))),
  onSnapshot:(ok,ko)=>F.onSnapshot(F.collection(fs,path),{includeMetadataChanges:true},s=>ok(wrapSnapDocs(s)),ko)}}
const db={doc:wDoc,collection:wCol};

const assets={upload:async file=>{
  let url;
  if(/^image\//.test(file.type)&&!/svg/.test(file.type))url=await window.shrinkImage(file);
  else{if(file.size>700000)throw Object.assign(new Error("El archivo es muy grande (máx. 700 KB). Sube una captura o un PDF más liviano."),{code:"too_large"});
    url=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(file)})}
  return{id:"inline-"+Date.now().toString(36),url}}};
const downloads={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.html?$/i.test(filename)?"text/html":/\.json$/i.test(filename)?"application/json":/\.pdf$/i.test(filename)?"application/pdf":"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}};

/* ---- Pantalla de ingreso ---- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function loginScreen(){
  let el=document.getElementById("vkLogin");if(!el){el=document.createElement("div");el.id="vkLogin";document.body.appendChild(el)}
  el.innerHTML=`<form class="box" autocomplete="on"><h1>Volkine Evaluación</h1><p>Ingresa con tu cuenta de Volkine.</p>
    <label for="vkE">Correo</label><input id="vkE" type="email" autocomplete="username" required>
    <label for="vkP">Contraseña</label><input id="vkP" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button><button type="button" class="lnk" id="vkForgot">Olvidé mi contraseña</button><div class="err" id="vkErr" role="alert"></div></form>`;
  const f=el.querySelector("form"),er=el.querySelector("#vkErr");
  f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector("button[type=submit]");b.disabled=true;er.textContent="";er.className="err";
    try{await A.setPersistence(auth,A.browserLocalPersistence);await A.signInWithEmailAndPassword(auth,f.vkE.value.trim(),f.vkP.value)}
    catch(e){er.textContent=/invalid|wrong|not-found|credential/i.test(e.code||"")?"Correo o contraseña incorrectos.":/too-many/i.test(e.code||"")?"Demasiados intentos. Espera unos minutos.":/network/i.test(e.code||"")?"Sin conexión a internet.":"No se pudo ingresar ("+(e.code||e.message)+")."}
    b.disabled=false};
  el.querySelector("#vkForgot").onclick=async()=>{const m=f.vkE.value.trim();if(!m){er.textContent="Escribe tu correo arriba y vuelve a tocar aquí.";return}
    try{await A.sendPasswordResetEmail(auth,m);er.className="err ok";er.textContent="Te enviamos un correo para crear una contraseña nueva."}catch(e){er.textContent="No se pudo enviar el correo ("+(e.code||e.message)+")."}};
}
function nameScreen(user){return new Promise(done=>{
  let el=document.getElementById("vkLogin");if(!el){el=document.createElement("div");el.id="vkLogin";document.body.appendChild(el)}
  el.innerHTML=`<form class="box"><h1>¿Cómo te llamas?</h1><p>Este nombre aparecerá en las evaluaciones que registres.</p>
    <label for="vkN">Nombre y apellido</label><input id="vkN" required placeholder="Ej.: Magdalena Pfingsthorn"><button type="submit">Guardar</button><div class="err" id="vkErr"></div></form>`;
  const f=el.querySelector("form");f.vkN.focus();
  f.onsubmit=async ev=>{ev.preventDefault();const n=f.vkN.value.trim().replace(/\s+/g," ");if(!n)return;
    try{await A.updateProfile(user,{displayName:n});done(n)}catch(e){el.querySelector("#vkErr").textContent="No se pudo guardar ("+(e.code||e.message)+")."}};
})}
function userMenu(user,name){
  const host=document.querySelector(".masthead");if(!host||document.getElementById("vkMe"))return;
  const d=document.createElement("div");d.id="vkMe";
  d.innerHTML=`<button type="button" aria-haspopup="true" aria-expanded="false">👤 ${esc(name.split(" ")[0])}</button><div class="menu" role="menu">
    <div class="who">${esc(name)}<br>${esc(user.email||"")}</div>
    <button type="button" data-k="exp">⬇ Descargar respaldo</button>
    <label>⬆ Importar respaldo<input type="file" accept=".json,application/json"></label>
    <button type="button" data-k="name">✎ Cambiar mi nombre</button>
    <button type="button" data-k="out">Cerrar sesión</button></div>`;
  host.appendChild(d);
  const tg=d.querySelector(":scope>button");
  tg.onclick=e=>{e.stopPropagation();const o=d.classList.toggle("open");tg.setAttribute("aria-expanded",o)};
  document.addEventListener("click",e=>{if(!d.contains(e.target)){d.classList.remove("open");tg.setAttribute("aria-expanded","false")}});
  d.querySelector('[data-k="exp"]').onclick=async()=>{d.classList.remove("open");try{await window.exportBackup()}catch(e){alert("No se pudo descargar el respaldo: "+(e.message||e))}};
  d.querySelector('[data-k="out"]').onclick=async()=>{await A.signOut(auth);location.reload()};
  d.querySelector('[data-k="name"]').onclick=async()=>{const n=prompt("Nombre que aparecerá en tus evaluaciones:",auth.currentUser.displayName||"");if(n&&n.trim()){await A.updateProfile(auth.currentUser,{displayName:n.trim()});location.reload()}};
  d.querySelector("input[type=file]").onchange=async e=>{const f=e.target.files[0];e.target.value="";d.classList.remove("open");if(!f)return;
    if(!confirm("¿Importar el respaldo \""+f.name+"\"? Los registros con el mismo identificador se reemplazan; el resto se mantiene."))return;
    try{const n=await window.importBackup(f);alert("Respaldo importado: "+n+" registros.")}catch(err){alert("No se pudo importar: "+(err.message||err))}};
}

let started=false;
A.onAuthStateChanged(auth,async user=>{
  if(!user){if(started){location.reload();return}loginScreen();return}
  if(started)return;started=true;
  let name=user.displayName;
  if(name==="Magdalena "+"Fingston"){name="Magdalena Pfingsthorn";try{await A.updateProfile(user,{displayName:name})}catch(e){}}
  if(!name)name=await nameScreen(user);
  document.getElementById("vkLogin")?.remove();
  userMenu(user,name);
  const u={id:async()=>user.uid,name:async()=>name,isOwner:()=>false,can:async()=>true};
  window.__fbResolve({use:async n=>({db,user:u,assets,downloads}[n]||null)});
});
</script>

.bcat .n{font:700 17px/1.2 var(--f-display);color:var(--head)}
.bcat .c{font-size:12.5px;color:var(--muted);margin-top:auto;position:relative;z-index:1}
.bcat .car{position:absolute;top:14px;right:16px;color:var(--bc);font-size:14px}
.bcat::after{content:"";position:absolute;right:12px;bottom:12px;width:56px;height:22px;background:var(--bc);opacity:.45;clip-path:polygon(60.6% 3.1%,100% 80.2%,88.2% 80.2%,61.2% 34.4%,4.1% 100%,0% 99.2%)}
.bcat.on{border-color:var(--bc);box-shadow:0 0 0 2px var(--bc) inset}
.bcat.dim{opacity:.55}
.tr-tool{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-left:8px}
.trow .tr-tool+.tr-go{margin-left:6px}
.mjb .tr-tool{display:none}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rk li{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--d-line)}
.rk li:first-child{border-top:0}
.rk .rn{flex:none;min-width:38px;font:800 28px/1 var(--f-display);color:var(--rc);font-variant-numeric:tabular-nums}
.rk .rt{flex:1;min-width:0;font:600 15px/1.3 var(--f-display);color:var(--d-fg)}
.rk .rp{flex:none;font:700 17px var(--f-display);color:var(--d-fg);font-variant-numeric:tabular-nums}
.rk .rp small{font-weight:500;font-size:13px;color:var(--d-muted)}
.hbr{display:inline-block;min-width:22px;color:var(--d-muted);font-weight:600;font-size:.85em}
.dmore{display:block;margin:12px auto 0;background:none;border:0;font:600 13px var(--f-display);color:#4fc0b2;cursor:pointer;padding:6px 10px;border-radius:8px}
.dmore:hover{text-decoration:underline}
.aey{display:flex;flex-direction:column;gap:12px}
.aeyh{font:700 30px/1 var(--f-display);color:#4fc0b2;margin:10px 0 0;padding-bottom:8px;border-bottom:2px solid color-mix(in srgb,#4fc0b2 40%,transparent)}
.aem{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.aeml{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.aeml .mn{font:700 14px var(--f-display);color:var(--head,#fff)}
.aeml .mc{font-size:12px;color:var(--muted)}
@media (max-width:420px){.aem{grid-template-columns:70px minmax(0,1fr);gap:8px}.aeml .mn{font-size:13px}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.addbtn{display:inline-flex;align-items:center;gap:6px;flex:none;background:transparent;border:1px solid color-mix(in srgb,#4fc0b2 55%,transparent);color:#4fc0b2;font:600 12.5px var(--f-display);padding:6px 12px 6px 8px;border-radius:999px;cursor:pointer}
.addbtn span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#4fc0b2;color:#0d182c;font-size:15px;line-height:1}
.addbtn:hover{background:color-mix(in srgb,#4fc0b2 14%,transparent)}
.addmenu{position:absolute;right:0;top:100%;margin-top:6px;z-index:20;display:flex;flex-direction:column;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.addmenu button{background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:12px 14px;font:600 14px var(--f-display);color:var(--fg);cursor:pointer}
.addmenu button:first-child{border-top:0}
.addmenu button:hover{background:var(--sunk)}
.tpick{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--accent);border-radius:14px;background:var(--sunk);scroll-margin-top:80px}
.tpk-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:62px;background:var(--sunk);padding:4px 0;z-index:2}
.tpk-g{display:flex;flex-direction:column;gap:2px}
.tpk{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.tpk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.trash{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:10px}.trash .tlist{width:100%}
.f.fbig{font:700 15px var(--f-display);color:var(--head)}.f.fbig input{font:600 19px var(--f-display);padding:14px 16px;min-height:56px}
.bbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bbh span{font:700 22px var(--f-display);color:var(--bc)}
.bbody{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding:16px 0 8px;border-top:2px solid var(--bc);scroll-margin-top:90px;animation:bdrop .2s ease-out}
@keyframes bdrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bbody{animation:none}}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gcard{--bc:#4fc0b2;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;font:inherit;color:var(--fg);background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 20%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:16px;padding:16px;min-height:96px}
.gcard:hover{border-color:var(--bc)}
.gcard .n{font:700 17px/1.25 var(--f-display);color:var(--head);overflow-wrap:anywhere}
.gcard .c,.lcard .c{font-size:12.5px;color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.crumb{font:600 12.5px var(--f-body);color:var(--muted)}
.tlink.ac{border-color:color-mix(in srgb,var(--ac) 60%,transparent);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acard{--ac:#4fc0b2;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:14px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px}
.acard .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.acard .an{font:700 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}
.acard .ak{font:700 13px var(--f-display);color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:999px;padding:1px 9px}
.arow{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:transparent;border:0;border-top:1px solid var(--line);color:var(--fg);font:inherit;padding:9px 2px;cursor:pointer;min-height:44px}
.arow:hover .nm{color:var(--ac)}
.arow .dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
.arow .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.bstage{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--head);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px;font-weight:600}
.bchip button{border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;width:26px;height:26px;border-radius:50%;cursor:pointer}
.bchip button:hover{background:var(--bad-bg);color:var(--bad)}
.bchk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.bchk input{width:auto;min-width:0}
.phero{--pc:#4fc0b2;background:linear-gradient(140deg,color-mix(in srgb,var(--pc) 14%,var(--surface)),var(--surface) 60%);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;align-items:center;gap:14px;min-width:0}
.ptop .av{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pc);color:#0d182c;font:700 20px var(--f-display)}
.ptop .pn{min-width:0}
.ptop h1{font-size:24px;overflow-wrap:anywhere}
.ptop .cd{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.06em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact .fi{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--pc);font-size:15px}
.fact .fl{display:block;font-size:11.5px;color:var(--muted)}
.fact .fv{display:block;font-weight:700;color:var(--fg);overflow-wrap:anywhere;line-height:1.3}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.emode{display:flex;flex-direction:column;gap:12px}
.emc{--ec:#4fc0b2;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;font:inherit;color:var(--fg);background:linear-gradient(150deg,color-mix(in srgb,var(--ec) 18%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-left:5px solid var(--ec);border-radius:16px;padding:18px 16px}

/* ===== Dashboard (Inicio): panel oscuro fijo, identidad Volkine ===== */
:root{--d-bg:#0d182c;--d-card:#132542;--d-card2:#18304f;--d-line:#24395c;--d-fg:#e8eff6;--d-muted:#93a6bd;--d-teal:#4fc0b2;--d-teal-ink:#06211d;--d-grid:#22375a;--d-unc:#5d6b82}
body.on-dash{background:var(--d-bg)}
body.on-dash .wrap,body.on-dash .masthead .in{max-width:1180px}
.dash{color:var(--d-fg);display:flex;flex-direction:column;gap:16px}
.dash h1,.dash h2,.dash h3{color:var(--d-fg)}
.dash .eyebrow{color:var(--d-teal)}
.dash .dm{color:var(--d-muted)}
.dhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.dhead h1{font-size:28px}
.dstore{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--f-body);color:var(--d-muted);margin-top:6px}
.dstore i{width:8px;height:8px;border-radius:50%;background:var(--d-teal);display:inline-block}
.dstore.off i{background:#e2b45c}
.dash .btn{background:var(--d-card);border-color:var(--d-line);color:var(--d-fg);min-height:42px}
.dash .btn:hover{border-color:var(--d-teal)}
.dash .btn.primary{background:var(--d-teal);border-color:var(--d-teal);color:var(--d-teal-ink)}
.dash select{background:var(--d-card);border-color:var(--d-line);color:var(--d-fg);min-height:42px;color-scheme:dark}
.dfilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;background:var(--d-card);border:1px solid var(--d-line);border-radius:14px;padding:12px 14px}
.dfilters label.f{color:var(--d-muted)}
.dfilters select{background:var(--d-bg)}
.dcard{background:var(--d-card);border:1px solid var(--d-line);border-radius:14px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.dcard .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dcard h2{font-size:16px}
.dcard .cap{font-size:12.5px;color:var(--d-muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.stat{--c:#4fc0b2;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 16%,var(--d-card)) 0%,var(--d-card) 62%);border:1px solid var(--d-line);border-top:3px solid var(--c);border-radius:16px;padding:14px 16px 16px;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.stat.c1{--c:#4fc0b2}.stat.c2{--c:#f39250}.stat.c3{--c:#e5649f}.stat.c4{--c:#5b8ff5}
.stat::after{content:"";position:absolute;right:12px;bottom:8px;width:44px;height:17px;background:var(--c);opacity:.25;clip-path:polygon(60.6% 3.1%,100% 80.2%,88.2% 80.2%,61.2% 34.4%,4.1% 100%,0% 99.2%)}
.stat .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat .sh .l{flex:1;min-width:0;overflow-wrap:normal;hyphens:manual}
.stat .vrow{display:flex;justify-content:center;align-items:center;padding:4px 0 16px;z-index:1}
.stat .stip{padding-bottom:18px}
.stat .vrow .ibtn{position:absolute;left:12px;bottom:10px;width:16px;height:16px;font-size:9.5px;border-width:1px;opacity:.75;z-index:2}
.stat .sic{flex:none}
.stat .sic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.stat .v{text-align:center;font:700 58px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--c);letter-spacing:-.02em}
.stat .l{font:600 13px/1.25 var(--f-display);color:var(--d-fg);overflow-wrap:anywhere}
.stat .ibtn{width:22px;height:22px;font-size:12px;border-color:color-mix(in srgb,var(--c) 70%,transparent);color:var(--c)}
.stat .ibtn.on,.stat .ibtn:hover{background:var(--c);color:#0d182c}
.stat .stip{font-size:12.5px;color:var(--d-muted);margin-top:6px;position:relative;z-index:1}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.dgrid.b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mchart{position:relative;height:220px;display:grid;grid-template-columns:30px 1fr;gap:6px}

.mchart .yax span{position:absolute;right:0;transform:translateY(50%)}
.mchart .plot{position:relative;border-bottom:1px solid var(--d-line)}
.mchart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--d-grid)}
.mchart .bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;align-items:end;padding-inline:2px}
.mchart .bar{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.mchart .bar i{display:block;width:62%;max-width:34px;background:var(--d-teal);border-radius:4px 4px 0 0;min-height:0}
.mchart .bar b{position:absolute;font:600 11.5px var(--f-mono);color:var(--d-fg);transform:translateY(-4px)}
.mchart .bar:hover i{background:#7fd6cb}
.mchart .bar .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#0a1322;border:1px solid var(--d-line);color:var(--d-fg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;display:none;z-index:2}
.mchart .bar:hover .tip,.mchart .bar:focus-visible .tip{display:block}
.mchart .bar:nth-child(-n+2) .tip{left:0;transform:none}
.mchart .bar:nth-child(n+11) .tip{left:auto;right:0;transform:none}
.mlabels{display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr));gap:0 0;font:500 11px var(--f-body);color:var(--d-muted);text-align:center;margin-top:6px}
.mlabels span:first-child{visibility:hidden}
.mempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--d-muted);font-size:13.5px;padding:0 20px}
.seg{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--d-bg)}

.legend .n small{font-weight:500;font-size:12px;color:var(--d-muted)}
.legend .n{font:700 14px var(--f-display);font-variant-numeric:tabular-nums;color:var(--d-fg);text-align:right}
.legend .p{font:500 12.5px var(--f-mono);color:var(--d-muted);min-width:44px;text-align:right}
.legend .z{opacity:.5}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb .top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}

.dle{--tc:#4fc0b2;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;font:inherit;color:var(--d-fg);background:var(--d-bg);border:1px solid var(--d-line);border-left:5px solid var(--tc);border-radius:12px;padding:12px 14px;min-height:64px}

.tchip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-body);color:var(--d-fg)}
.tchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.dempty{border:1px dashed var(--d-line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--d-muted);font-size:13.5px}

.dash{padding-bottom:84px}

.dash .dfrow select{min-height:36px;font-size:13.5px;padding:6px 8px;background:var(--d-bg)}
.dash .dfrow .btn{min-height:36px}
@media (max-width:640px){.dfrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dfrow .f:first-child{grid-column:1/-1}}
.fabwrap{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab{width:60px;height:60px;border-radius:50%;border:0;background:var(--d-teal);color:var(--d-teal-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 4px rgba(79,192,178,.18);transition:transform .18s ease}
.fab:hover{background:#6fd0c4}
.fab.open{transform:rotate(45deg)}
.fab:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.fabmenu{background:var(--d-card2);border:1px solid var(--d-line);border-radius:16px;padding:6px;display:flex;flex-direction:column;min-width:220px;max-width:calc(100vw - 40px);box-shadow:0 10px 30px rgba(0,0,0,.5);color:var(--d-fg)}
.fabmenu>button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:var(--d-fg);font:600 15px var(--f-display);padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left;min-height:48px}
.fabmenu>button:hover,.fabmenu>button:focus-visible{background:var(--d-card)}
.fabmenu .ic{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);background:rgba(79,192,178,.16);color:var(--d-teal);display:grid;place-items:center;font:700 18px var(--f-display)}
.fabmenu.pick{padding:14px;gap:12px;width:300px}
.fabmenu.pick label.f{color:var(--d-muted)}
.fabmenu select{background:var(--d-bg);border-color:var(--d-line);color:var(--d-fg);min-height:44px;color-scheme:dark}
.fabmenu .btn{background:var(--d-card);border-color:var(--d-line);color:var(--d-fg);min-height:42px}
.fabmenu .btn.primary{background:var(--d-teal);border-color:var(--d-teal);color:var(--d-teal-ink)}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}
.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--d-card);border:1px solid var(--d-teal);border-radius:14px;padding:12px 14px}
.picker label.f{color:var(--d-muted);flex:1 1 220px}
.dash :focus-visible{outline-color:var(--d-teal)}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid,.dgrid.b{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.dfilters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dfilters .f:first-child{grid-column:1/-1}.stat .v{font-size:56px}.stat .l{font-size:13px}.mchart{height:180px}.mlabels{font-size:9.5px}.mchart .bar b{font-size:10px}}
@media (max-width:520px){.masthead img{height:68px} .masthead .in{padding-block:16px 14px} .navband .in{gap:2px} .navband button{flex:1;padding-inline:8px;font-size:14px} .phase{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const normKey=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const JUMPT=new Set(["cmj","sj","cmj_arms","cmj_uni","rsimod"]);const normMetric=r=>{const m=normKey(r.metric);return JUMPT.has(r.tid)&&(m==="altura"||m==="resultado")?"altura de salto":m};
const rowKey=r=>(r.tid||normKey(r.test))+"|"+normMetric(r);
function higherBetter(r){
  const m=normKey(r.metric),u=String(r.unit||"").toLowerCase().trim();
  if(/contacto|contact/.test(m))return false;
  if(/vuelo|flight/.test(m))return true;
  const t=T[r.tid];
  if(/velocidad|speed|rsi|altura|distancia/.test(m))return true;
  if(t&&t.hb!=null&&(!u||u===String(t.u).toLowerCase()))return t.hb;
  if(u==="s"||u==="seg"||u==="ms"){if(/sprint|505|cod|illinois|timed|6 m/.test(normKey(r.test)))return false;if(t&&t.a==="core")return true}
  if(t&&t.hb!=null)return t.hb;return true;
}
/* Agrupa las filas de una evaluación: clave → {D,I,"":valor, unit, test, metric} */
function groupRows(e){const g={};(e.rows||[]).forEach(r=>{const v=num(r.value);if(v==null)return;const k=rowKey(r);
  const o=g[k]||(g[k]={tid:r.tid,test:r.test||(T[r.tid]||{}).n||"",metric:r.metric||"",unit:r.unit||"",hb:higherBetter(r),v:{}});o.v[r.side||""]=v});return g}
function lsiOf(o,aff){const r=o.v.D,l=o.v.I;if(r==null||l==null||r<=0||l<=0)return null;
  if(aff==="D"||aff==="I"){const inv=aff==="D"?r:l,un=aff==="D"?l:r;return o.hb?inv/un*100:un/inv*100}
  return Math.min(r,l)/Math.max(r,l)*100}
const mainVal=(o,aff)=>{if(o.v[""]!=null)return o.v[""];if(aff&&o.v[aff]!=null)return o.v[aff];const a=[o.v.D,o.v.I].filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const lsiPill=v=>v==null?"":`<span class="pill ${v>=90?"ok":v>=80?"warn":"bad"}">LSI ${fmt(v,0)}%</span>`;
function delta(hb,a,b){if(a==null||b==null)return"";const d=b-a;if(Math.abs(d)<1e-9)return`<span class="muted mono">=</span>`;
  const better=hb==null?null:(hb?d>0:d<0);const pct=a!==0?` (${d>0?"+":""}${fmt(d/Math.abs(a)*100,1)}%)`:"";
  return`<span class="mono ${better==null?"muted":better?"up":"down"}">${d>0?"+":""}${fmt(d)}${pct}</span>`}
function spark(vals){const v=vals.filter(x=>x!=null);if(v.length<2)return"";const w=64,h=20,min=Math.min(...v),max=Math.max(...v),rg=max-min||1;
  const pts=vals.map((x,i)=>x==null?null:[i/(vals.length-1)*(w-4)+2,h-2-((x-min)/rg)*(h-4)]).filter(Boolean);const last=pts[pts.length-1];
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="${pts.map(p=>p.join(",")).join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`}
const sideStr=(o)=>{const p=[];if(o.v[""]!=null)p.push(fmt(o.v[""]));if(o.v.D!=null)p.push("D "+fmt(o.v.D));if(o.v.I!=null)p.push("I "+fmt(o.v.I));return p.join(" · ")};
/* Tabla de una evaluación frente a la anterior: filas planas para pantalla, informe y Claude */
function compareRows(e,prev,p){const g=groupRows(e),pg=prev?groupRows(prev):{};
  return Object.entries(g).map(([k,o])=>{const po=pg[k];const cur=mainVal(o,p.aff),pv=po?mainVal(po,p.aff):null;
    return{k,o,po,test:o.test,metric:o.metric,unit:o.unit,hb:o.hb,cur,pv,curS:sideStr(o),prevS:po?sideStr(po):"",lsi:lsiOf(o,p.aff),plsi:po?lsiOf(po,p.aff):null}})}

async function pdfToText(file){
  const lib=window.pdfjsLib;if(!lib)throw new Error("pdf");
  try{lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let txt="";const imgs=[];
  for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    let line="",lastY=null;tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){txt+=line.trim()+"\n";line=""}line+=it.str+" ";lastY=y});txt+=line.trim()+"\n\n--- página "+i+" ---\n";
    if(canImg&&i<=4){try{const vp=pg.getViewport({scale:1.6});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;imgs.push(await new Promise(r=>cv.toBlob(r,"image/png")))}catch(e){}}}
  return{txt,imgs,pages:pdf.numPages};
}

const REP=[["resumen","Resumen para el paciente","Dos o tres frases claras sobre cómo está hoy."],["resultados","Lectura de los resultados","Por dominio: salto, reactividad, simetría, velocidad, fuerza…"],["interpretacion","Interpretación profesional","Integración con la lesión, la etapa y los criterios de la carpeta."],["plan","Plan y recomendaciones","Qué trabajar hasta la próxima evaluación."],["reeval","Próxima reevaluación","Cuándo y en qué condiciones repetir."],["tecnica","Notas técnicas","Equipo, versión de la app, protocolo y límites de la medición."]];
function reportContext(e){const p=S.patients.find(x=>x.id===e.pid)||{};const prev=prevEval(e);const f=FOLDER(e.folder);const c=e.ctx||{};
  const rows=compareRows(e,prev,p).map(r=>`- ${r.test} · ${r.metric}: ${r.curS} ${r.unit}${r.prevS?` (antes: ${r.prevS} ${r.unit})`:""}${r.lsi!=null?` · LSI ${fmt(r.lsi,0)}%${r.plsi!=null?` (antes ${fmt(r.plsi,0)}%)`:""}`:""}${r.hb===false?" · menor es mejor":""}`).join("\n");
  const mm=monthsBetween(p.inj,e.date);
  return`PACIENTE: código ${p.code||"—"}, ${ageOf(p)!=null?ageOf(p)+" años, ":""}deporte ${p.sport||"—"} (${p.level||"nivel no indicado"}), masa ${e.mass||p.mass||"—"} kg, lado dominante ${p.dom||"—"}, lado afectado ${p.aff||"ninguno"}.
DIAGNÓSTICO: ${p.dx||"—"}${p.inj?`; lesión o cirugía el ${fdate(p.inj)}${mm!=null&&mm>=0?` (${fmt(mm,1)} meses al evaluar)`:""}`:""}.
EVALUACIÓN: ${fdate(e.date)}${prev?`; se compara con la del ${fdate(prev.date)}`:"; es la primera evaluación"}.
CARPETA: ${f?bFull(f)+(f.crit?". Evidencia: "+f.crit:""):"selección libre"}.
CONTEXTO: dolor basal ${c.pain||"—"}/10, sueño ${c.sleep||"—"}, carga 48 h ${c.load||"—"}, montaje ${c.setup||"—"}.
OBSERVACIONES DE LA KINESIÓLOGA: ${c.notes||"—"}
RESULTADOS (actual y anterior):
${rows||"(sin resultados)"}`}
const REP_RULES=`Reglas: escribe en español de Chile, claro y cálido para el paciente pero preciso. Separa el dato medido de la conclusión profesional. No declares "apto", "sin riesgo" ni alta deportiva por un test aislado; no digas que aumentó la fuerza sólo porque aumentó el salto; marca como estimadas la potencia, F0, V0 o torque calculados por la app; un cambio pequeño puede estar dentro del error de medición. Usa las observaciones de la kinesióloga como guía principal de la interpretación. No inventes datos que no estén arriba.
Responde SOLO con JSON: {${REP.map(([k])=>`"${k}": string`).join(", ")}}. Cada campo en texto plano, puede usar saltos de línea y viñetas con "• ".`;
async function draftReport(instr){
  const e=S.evals.find(x=>x.id===S.eid);if(!e||!sampleFn)return;await saveNotes();
  S.busy="report";setMsg(instr?"Claude está aplicando el cambio…":"Claude está redactando el borrador…");render();
  try{
    const cur=S.rep;const prompt=instr
      ?`Eres asistente de una kinesióloga. Este es el informe actual de una evaluación física y los datos de base. Aplica el cambio que pide y devuelve el informe completo.\n\nCAMBIO PEDIDO: ${instr}\n\nINFORME ACTUAL:\n${JSON.stringify(cur)}\n\nDATOS:\n${reportContext(e)}\n\n${REP_RULES}`
      :`Eres asistente de una kinesióloga. Redacta el borrador del informe personalizado de esta evaluación física con datos de My Jump Lab y otras pruebas.\n\n${reportContext(e)}\n\nSecciones: ${REP.map(([k,n,h])=>`${k} = ${n} (${h})`).join("; ")}.\n${REP_RULES}`;
    const res=await sampleFn.json(prompt,{cache:false});
    REP.forEach(([k])=>{if(typeof res[k]==="string")S.rep[k]=res[k]});
    setMsg(instr?"Cambio aplicado. Revisa y guarda.":"Borrador listo. Edítalo y guárdalo.");
  }catch(err){setMsg(sampleErr(err,"redactar el informe"),true)}
  S.busy=null;render();
}
function collectReport(){if(!S.rep)return;REP.forEach(([k])=>{const el=document.getElementById("rp-"+k);if(el)S.rep[k]=el.value})}
/* Resultados de una evaluación agrupados por test: valor principal + métricas secundarias, comparado con la última medición anterior de ese mismo test */
function testCompare(e,p){const g=groupRows(e);const before=S.evals.filter(x=>x.pid===e.pid&&x.id!==e.id&&((x.date||"")<(e.date||"")||((x.date||"")===(e.date||"")&&(x.created||0)<(e.created||0)))).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));
  const bg=before.map(x=>({e:x,g:groupRows(x)}));const tests=new Map();
  Object.entries(g).forEach(([k,o])=>{const tk=o.tid||normKey(o.test);if(!tests.has(tk))tests.set(tk,{tk,name:o.test||(T[tk]||{}).n||"Test",ms:[]});
    const pb=bg.find(x=>x.g[k]);const po=pb?pb.g[k]:null;
    tests.get(tk).ms.push({k,o,metric:o.metric,unit:o.unit||"",hb:o.hb,curS:sideStr(o),cur:mainVal(o,p.aff),prevS:po?sideStr(po):"",pv:po?mainVal(po,p.aff):null,pDate:pb?pb.e.date:"",lsi:lsiOf(o,p.aff)})});
  return[...tests.values()].map(t=>{const pm=t.ms.reduce((a,b)=>metricScore(t.tk,b.o)>metricScore(t.tk,a.o)?b:a);return{...t,pm,others:t.ms.filter(m=>m!==pm)}})}
function pctTxt(hb,a,b){if(a==null||b==null)return"";const d=b-a;if(Math.abs(d)<1e-9)return"= sin cambio";const pc=a?d/Math.abs(a)*100:null;const better=hb==null?null:(hb?d>0:d<0);
  return{t:(d>0?"▲ ":"▼ ")+(pc!=null?(pc>0?"+":"")+fmt(pc,1)+"%":(d>0?"+":"")+fmt(d)),c:better==null?"":better?"up":"down"}}
function prevEval(e){const ev=S.evals.filter(x=>x.pid===e.pid);const i=ev.findIndex(x=>x.id===e.id);return i>0?ev[i-1]:null}

function mjlNum(s){s=String(s??"").trim();if(!s||s==="---"||/∞|inf|nan/i.test(s))return null;
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");const n=Number(s);return isFinite(n)?n:null}
const mjlFmt=x=>String(Math.round(x*100)/100);
function mjlDate(s){const m=String(s||"").match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const m2=String(s||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:""}
function mjlSplit(line,d){const out=[];let cur="",q=false;for(const ch of line){if(ch==='"'){q=!q;continue}if(ch===d&&!q){out.push(cur);cur="";continue}cur+=ch}out.push(cur);return out}
function parseMjlCsv(text){

const SHORT={ankle_df:"Dorsiflexión",hip_ir:"RI cadera",plank:"Plancha",q_iso:"Cuádriceps",h_iso:"Isquios",add_iso:"Aductores",abd_iso:"Abductores",pf_iso:"Flexores plantares",hop_single:"Single hop",hop_triple:"Triple hop",hop_cross:"Crossover hop",side_bridge:"Puente lateral",mcgill_flex:"Flexores tronco",slbridge:"Puente unipodal",heel_raise:"Elev. de talón",ybal_lq:"Y-Balance",nordic_ba:"Nordic",grip:"Prensión",cmj:"CMJ",sj:"SJ",cmj_arms:"CMJ con brazos",dj_rsi:"Drop jump",cmj_uni:"CMJ unipodal",rsimod:"RSI-mod",rsi105:"RSI 10/5",sprint10:"Sprint 10 m",sprint30:"Sprint 30 m",t505:"505"};
const tShort=(tk,o)=>SHORT[tk]||(T[tk]&&T[tk].n)||o.test||"Test";
const MSH=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const sdate=d=>{if(!d)return"–";const[y,m,dd]=d.split("-");return`${+dd} ${MSH[+m-1]} ${y.slice(2)}`};
function metricScore(tk,o){const m=normKey(o.metric),u=String(o.unit||"").trim();let s=0;const t=T[tk];
  if(t&&t.u&&u===t.u)s+=4;if(/^altura/.test(m))s+=3;if(/^rsi /.test(m)||m==="rsi")s+=2;if(m==="resultado")s+=3;if(/estimad|stiffness|velocidad de despegue|tiempo de vuelo|indice/.test(m))s-=3;return s}
/* Agrupa por test: cada test con su métrica principal y la serie de valores por evaluación */
function testSummary(p,ev){const gs=ev.map(groupRows);const tests=new Map();
  gs.forEach((g,i)=>Object.entries(g).forEach(([k,o])=>{const tk=o.tid||normKey(o.test);let t=tests.get(tk);
    if(!t){t={tk,name:o.test||(T[tk]||{}).n||"",short:tShort(tk,o),keys:new Map(),evs:new Set()};tests.set(tk,t)}
    t.evs.add(i);if(!t.keys.has(k))t.keys.set(k,{k,o,series:[]});t.keys.get(k).series.push({i,o,v:mainVal(o,p.aff)})}));
  return[...tests.values()].map(t=>{const ks=[...t.keys.values()];
    const best=ks.reduce((a,b)=>{const sa=metricScore(t.tk,a.o),sb=metricScore(t.tk,b.o);if(sb!==sa)return sb>sa?b:a;
      const la=a.series[a.series.length-1].i,lb=b.series[b.series.length-1].i;return lb>la?b:a});
    const last=Math.max(...t.evs);return{...t,primary:best,metrics:ks,lastI:last,count:t.evs.size}})
   .sort((a,b)=>b.count-a.count||b.lastI-a.lastI||a.short.localeCompare(b.short,"es"))}
function chg(hb,a,b){if(a==null||b==null)return"";const d=b-a;if(Math.abs(d)<1e-9)return'<span class="pg eq">= sin cambio</span>';

function evoChart(pk,ev,p){

  const pts=ser.map(([n,k,c])=>({n,c,k,pts:s.map(x=>({d:ev[x.i].date,v:x.o.v[k]})).filter(q=>q.v!=null)})).filter(z=>z.pts.length);
  const all=pts.flatMap(z=>z.pts);if(!all.length)return"";
  const W=640,H=230,L=48,R=56,T=22,B=34;const t=d=>new Date(d+"T12:00").getTime();
  const xs=all.map(q=>t(q.d));let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5*15;x1+=864e5*15}
  let y0=Math.min(...all.map(q=>q.v)),y1=Math.max(...all.map(q=>q.v));const pad=(y1-y0||Math.abs(y1)||1)*0.25;y0-=pad;y1+=pad;if(Math.min(...all.map(q=>q.v))>=0&&y0<0)y0=0;
  const X=d=>L+(t(d)-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const step=(()=>{const r=(y1-y0)/4,m=Math.pow(10,Math.floor(Math.log10(r)));return[1,2,2.5,5,10].map(k=>k*m).find(k=>k>=r)})();
  let g="";for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step){const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="cg"/><text x="${L-8}" y="${y+4}" class="cy">${fmt(v)}</text>`}
  const dates=[...new Set(all.map(q=>q.d))].sort();const MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const showD=dates.length<=6?dates:[dates[0],dates[dates.length-1]];

  const u=pk.o.unit||"";
  const lines=pts.map(z=>{const path=z.pts.map((q,i)=>`${i?"L":"M"}${X(q.d).toFixed(1)},${Y(q.v).toFixed(1)}`).join("");const last=z.pts[z.pts.length-1];
    const dots=z.pts.map((q,i)=>`<g class="cpt"><circle cx="${X(q.d)}" cy="${Y(q.v)}" r="14" fill="transparent"/><circle cx="${X(q.d)}" cy="${Y(q.v)}" r="5" fill="${z.c}" class="cdot"/><title>${z.n?z.n+" · ":""}${fdate(q.d)}: ${fmt(q.v)} ${u}</title></g>`).join("");
    return`<path d="${path}" fill="none" stroke="${z.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${X(last.d)+10}" y="${Y(last.v)+4}" class="cl">${fmt(last.v)}${z.n?` <tspan class="cln">${z.k}</tspan>`:""}</text>`}).join("");

function ageOf(p){if(p&&p.birth){const b=new Date(p.birth+"T12:00"),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a>=0&&a<120?a:null}const a=num(p&&p.age);return a!=null?a:null}

function dashEvals(){
  const D=S.dash;const pm=new Map(S.patients.map(p=>[p.id,p]));

  if(["30","90","365"].includes(D.period))from=daysAgo(+D.period);
  if(/^y\d{4}$/.test(D.period)){const y=D.period.slice(1);from=y+"-01-01";to=y+"-12-31"}
  return S.evals.filter(e=>{const p=pm.get(e.pid);if(!p||!e.date)return false;

}

function donut(items){const tot=items.reduce((a,x)=>a+x.v,0);if(!tot)return"";
  const R=96,C=100;let a0=-Math.PI/2;const live=items.filter(x=>x.v);

    const P=ang=>`${(C+R*Math.cos(ang)).toFixed(2)},${(C+R*Math.sin(ang)).toFixed(2)}`;
    const d=f>=0.9999?`M${C-R},${C}A${R},${R} 0 1 1 ${C+R},${C}A${R},${R} 0 1 1 ${C-R},${C}Z`:`M${C},${C}L${P(a0)}A${R},${R} 0 ${big} 1 ${P(a1)}Z`;
    const mid=(a0+a1)/2;a0=a1;const rr=live.length===1?0:R*0.62;const lx=C+rr*Math.cos(mid),ly=C+rr*Math.sin(mid);
    const txt=f>=0.05?`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" class="dpl" style="fill:${String(x.c).replace("--c","--t")}${f<0.1?";font-size:11px":""}">${esc(x.a)}</text>`:"";
    return`<path d="${d}" fill="${x.c}" class="dsl" data-i="${di}"><title>${esc(x.n)}: ${x.v} (${Math.round(f*100)}%)</title></path>${txt}`}).join("");
  return`<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(live.map(x=>x.n+" "+x.v).join(", "))}">${arcs}</svg>
   <ul class="dleg">${items.map((x,i)=>`<li class="${x.v?"":"z"}" data-i="${i}"><i style="background:${x.c}"></i><span class="dn">${esc(x.n)}${String(x.n).trim().toLowerCase()===String(x.a).trim().toLowerCase()?"":` <span class="dab">(${esc(x.a)})</span>`}</span><span class="dv">${Math.round(x.v/tot*100)}%<small> (${x.v})</small></span></li>`).join("")}</ul></div>`}

function collectBat(){const B=S.bedit;if(!B)return;const g=id=>document.getElementById(id);if(!g("be-n")&&!g("be-lname"))return;
  if(g("be-n"))B.n=g("be-n").value.trim();B.s=g("be-s").value.trim();
  if(g("be-lname")){const sel=g("be-grp-sel");B.grp=(sel.value==="__otro"?g("be-grp-new").value.trim():sel.value)||"Otras lesiones";const ln=g("be-lname").value.trim(),vr=g("be-var").value.trim();if(FLAT.includes(B.grp)){B.n=vr?ln+" · "+vr:ln;B.sub=B.n}else{B.sub=ln;B.n=vr||ln}}B.intro=g("be-intro").value.trim();
  if(B.g==="les"){B.fases.forEach((x,i)=>{if(!g("be-w-"+i))return;x.w=g("be-w-"+i).value.trim();x.n=g("be-sn-"+i).value.trim();x.o=g("be-o-"+i).value.trim()});
    B.crit=g("be-crit").value.trim();B.interp=g("be-interp").value.split("\n").map(x=>x.trim()).filter(Boolean);B.prec=g("be-prec").value.split("\n").map(x=>x.trim()).filter(Boolean)}
  else if(B.g==="dep"){B.les=LES.filter(l=>g("be-les-"+l.id)?.checked).map(l=>l.id);if(g("be-lesx"))B.lesx=g("be-lesx").value.split("\n").map(x=>x.trim()).filter(Boolean)}}

async function aiSport(B,want){const kind=B.g==="gen"?"evaluación general":"deporte";
  const prompt=`Eres kinesiólogo deportivo y diseñador de íconos. Trabajas para la herramienta de evaluación física de un centro de kinesiología en Chile.
${kind==="deporte"?"Deporte":"Evaluación"}: "${B.n}"${B.s?` (${B.s})`:""}.
Devuelve SOLO un objeto JSON con estas claves:
${want.icon?`- "icono": marcado SVG interno (sin la etiqueta <svg>) para un pictograma de línea que represente "${B.n}" de forma inmediata y seria (no infantil, sin caras ni texto). Reglas: viewBox 0 0 24 24; todo debe caber dentro de un círculo de radio 9.5 centrado en (12,12); usa solo path, circle, ellipse, line, polyline, polygon, rect, g; trazo heredado (stroke ya definido, ancho 1.6; puedes usar stroke-width 2–2.6 en el cuerpo de una persona); fill="none" salvo detalles pequeños sólidos con fill="#163366" y stroke="none"; máximo 14 elementos; figuras humanas estilizadas como en estos ejemplos del mismo set:
  running: ${ICONS.running}
  ciclismo: ${ICONS.bici}
`:""}${want.les?`- "lesiones": array de ids, elegidos SOLO de esta lista, de las baterías que corresponden a lesiones frecuentes en ${B.n} según la epidemiología publicada (no incluyas ids que no apliquen): ${LES.map(l=>`${l.id}=${bFull(l)}`).join("; ")}
- "otras": array de hasta 6 lesiones frecuentes en ${B.n} que NO estén cubiertas por esa lista, en español, nombre breve.
`:""}${want.tests?`- "tests": array de 5 a 9 ids de tests útiles para evaluar a un deportista de ${B.n}, elegidos SOLO de: ${Object.keys(T).map(k=>`${k}=${T[k].n}`).join("; ")}
`:""}${want.s?`- "subtitulo": máximo 6 palabras con las demandas principales.
`:""}${want.intro?`- "descripcion": 1–2 frases sobre las demandas físicas y para qué sirve esta batería.
`:""}No inventes referencias ni cifras.`;
  return await sampleFn.json(prompt,{cache:false})}
function applyAi(B,res,want){let n=0;
  if(want.icon&&res.icono){const c=cleanSvg(res.icono);if(c){B.icsvg=c;B.ic="c_pending";n++}}
  if(want.les){const ids=(Array.isArray(res.lesiones)?res.lesiones:[]).filter(x=>LES.some(l=>l.id===x));B.les=ids;B.lesx=(Array.isArray(res.otras)?res.otras:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,8);n++}
  if(want.tests){const ts=(Array.isArray(res.tests)?res.tests:[]).filter(k=>T[k]);if(ts.length){B.t=ts;n++}}
  if(want.s&&res.subtitulo)B.s=String(res.subtitulo).slice(0,80);if(want.intro&&res.descripcion)B.intro=String(res.descripcion).slice(0,600);
  return n}

  else if(a==="addTest"){collectForm();const i=S.form.cards.findIndex(x=>x.tid===id);if(i>=0){focusCard(i);return}S.form.cards.push(newCard(id));render();focusCard(S.form.cards.length-1)}
  else if(a==="addT"){collectForm();if(!S.form.cards.some(x=>x.tid===id))S.form.cards.push(...newCards(id));render()}
  else if(a==="stage"){collectForm();S.form.stage=S.form.stage===+id?null:+id;render();document.querySelector(".stg.open")?.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="addStageT"||a==="addAllT"){collectForm();const f=FOLDER(S.form.folder);const ts=a==="addAllT"?f.t:f.fases[+id].t;let first=-1;ts.forEach(t=>{if(!S.form.cards.some(x=>x.tid===t)){S.form.cards.push(newCard(t));if(first<0)first=S.form.cards.length-1}});render();if(first>=0)focusCard(first)}
  else if(a==="rmCard"){collectForm();S.form.cards.splice(+id,1);render()}
  else if(a==="toggleMode"){collectForm();const x=S.form.cards[+id];if(x.mode==="bi"){x.mode="one";if(!x.v.V)x.v.V=x.v.D||x.v.I||""}else{x.mode="bi";if(!x.v.D&&!x.v.I)x.v.D=x.v.V||""}render()}
  else if(a==="addMetric"){collectForm();const x=S.form.cards[+id];S.form.cards.splice(+id+1,0,{...x,metric:"",src:"manual",v:{D:"",I:"",V:""},meta:{}});render();document.getElementById(`c-${+id+1}-metric`)?.focus()}
  else if(a==="saveE"){await saveEval(b)}
  else if(a==="askDelP"){S.confirm="p:"+S.pid;render()}
  else if(a==="askDelE"){S.confirm="e:"+S.eid;render()}
  else if(a==="noConfirm"){S.confirm=null;render()}
  else if(a==="doDelP"){try{for(const x of patEvals(id))await del("e",x.id);await del("p",id);S.pid=null;S.confirm=null;go()}catch(err){alertMsg(err)}}
  else if(a==="doDelE"){try{await del("e",id);S.eid=null;S.rep=null;S.confirm=null;go()}catch(err){alertMsg(err)}}
  else if(a==="draft"){await draftReport()}
  else if(a==="revise"){const v=document.getElementById("rp-instr").value.trim();if(!v){document.getElementById("rp-instr").focus();return}await draftReport(v)}
  else if(a==="saveRep"){await saveReport()}
  else if(a==="dlPdf"){await saveReport();const ev=S.evals.find(x=>x.id===S.eid);const p=S.patients.find(x=>x.id===ev.pid)||{};S.busy="pdf";render();
    try{const blob=await reportPDFBlob(ev);S.busy=null;render();const fn=`Informe ${pName(p)} ${evalName(ev)} ${ev.date}.pdf`;try{await downloads.save({filename:fn,data:blob})}catch(e1){if(e1&&e1.code==="declined")throw e1;await downloads.save({filename:fn,data:new Uint8Array(await blob.arrayBuffer())})}setMsg("Informe descargado en PDF.")}
    catch(err){S.busy=null;render();setMsg(err.code==="declined"?"Descarga cancelada.":"No se pudo generar el PDF. Prueba con la versión HTML.",err.code!=="declined")}}
  else if(a==="dlRep"){await saveReport();const ev=S.evals.find(x=>x.id===S.eid);const p=S.patients.find(x=>x.id===ev.pid)||{};
    try{await downloads.save({filename:`Informe ${pName(p)} ${evalName(ev)} ${ev.date}.html`,data:reportHTML(ev)});setMsg("Informe descargado. Ábrelo en el navegador para imprimirlo o guardarlo como PDF.")}
    catch(err){setMsg(err.code==="declined"?"Descarga cancelada.":"No se pudo descargar el informe en esta vista.",err.code!=="declined")}}
  else if(a==="openF"){S.stOpen=null;S.info.binfo=false;const fo=FOLDER(id);if(fo&&fo.g==="les"){S.lg=fo.grp;S.ls=fo.sub}S.folder=id;S.test=null;if(S.view!=="carpetas")S.view="carpetas";go()}
  else if(a==="closeF"){const fo=FOLDER(S.folder);if(fo&&fo.g==="les"&&(FLAT.includes(fo.grp)||LES.filter(f=>f.grp===fo.grp&&f.sub===fo.sub).length===1))S.ls=null;S.folder=null;go()}
  else if(a==="openT"){S.tedit=null;S.test=id;go()}
  else if(a==="closeT"){S.test=null;go()}
  else if(a==="sample"){await loadSample()}
});
/* Informe en PDF: se dibuja el mismo informe HTML en un marco oculto y se convierte con html2pdf (jsPDF + html2canvas) */
let _h2p=null;function loadH2P(){if(window.html2pdf)return Promise.resolve();if(_h2p)return _h2p;
  _h2p=new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";sc.onload=ok;sc.onerror=()=>{_h2p=null;ko(new Error("No se pudo cargar el generador de PDF."))};document.head.append(sc)});return _h2p}
async function reportPDFBlob(ev){await loadH2P();
  const html=reportHTML(ev);const css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1]||"";const body=(html.match(/<body[^>]*>([\s\S]*)<\/body>/)||[])[1]||"";
  /* estilos del informe acotados al contenedor; el resto de la app no interfiere */
  const scoped=css.replace(/@media print\{[^}]*\}\}?/g,"").replace(/(^|\})\s*([^@{}][^{}]*)\{/g,(m,b,sel)=>b+sel.split(",").map(x=>{x=x.trim();return x==="body"?".rpdf":".rpdf "+x}).join(",")+"{");
  const box=document.createElement("div");box.setAttribute("aria-hidden","true");
  box.style.cssText="position:fixed;left:0;top:0;width:794px;z-index:-1;pointer-events:none";
  box.innerHTML=`<style>.rpdf,.rpdf *{all:revert}.rpdf{background:#fff!important;box-sizing:border-box;width:auto!important;max-width:none!important;margin:0!important;padding:6px 10px!important}${scoped}</style><div class="rpdf">${body}</div>`;
  document.documentElement.append(box);
  try{await new Promise(r=>setTimeout(r,200));
    return await html2pdf().set({margin:[8,6,10,6],image:{type:"jpeg",quality:.96},html2canvas:{scale:2,backgroundColor:"#ffffff",scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr","svg","img","h2","h3"]}}).from(box.querySelector(".rpdf")).outputPdf("blob")}
  finally{box.remove()}}
async function saveRename(){const e=S.evals.find(x=>x.id===S.eid);const el=document.getElementById("ren-in");if(!e||!el)return;
  const rec={...e,nombre:el.value.trim()};delete rec.id;try{await put("e",e.id,rec);e.nombre=rec.nombre;S.ren=null;render()}catch(err){setMsg(errText(err),true)}}
async function saveEval(btn){
  collectForm();const F=S.form;const out=document.getElementById("saveMsg");
  const rows=cardsToRows(F.cards).filter(r=>(r.tid||r.test)&&num(r.value)!=null).map(r=>{const o={tid:r.tid||null,test:r.test||"",metric:r.metric||"Resultado",side:r.side||"",value:String(num(r.value)),unit:r.unit||"",src:r.src||"manual"};
    if(r.attempts&&r.attempts.length)o.attempts=r.attempts;if(r.basis)o.basis=r.basis;if(r.note)o.note=r.note;if(r.date)o.date=r.date;return o});
  /* Saltos: completar altura, tiempo de vuelo y velocidad entre sí (h = g·t²/8, v = √(2gh)) */
  ["cmj","sj","cmj_arms"].forEach(tid=>{const sides=[...new Set(rows.filter(r=>r.tid===tid).map(r=>(r.date||"")+"#"+r.side))];
    sides.forEach(k=>{const[d,sd]=k.split("#");const pick=m=>rows.find(r=>r.tid===tid&&(r.date||"")===d&&r.side===sd&&normMetric(r)===m);
      const H=pick("altura de salto"),Tv=pick("tiempo de vuelo"),V=pick("velocidad de despegue");const base={tid,test:T[tid].n,side:sd,src:"manual",note:"calculado desde la altura de salto",...(d?{date:d}:{})};
      let h=H?num(H.value)/100:null;if(h==null&&Tv){h=9.81*Math.pow(num(Tv.value)/1000,2)/8;rows.push({...base,metric:"Altura de salto",unit:"cm",value:String(Math.round(h*10000)/100),note:"calculado desde el tiempo de vuelo"})}
      if(h!=null&&h>0){if(!Tv)rows.push({...base,metric:"Tiempo de vuelo",unit:"ms",value:String(Math.round(Math.sqrt(8*h/9.81)*100000)/100)});
        if(!V)rows.push({...base,metric:"Velocidad de despegue",unit:"m/s",value:String(Math.round(Math.sqrt(2*9.81*h)*100)/100)})}})});
  ["dj_rsi","dj_uni"].forEach(tid=>{[...new Set(rows.filter(r=>r.tid===tid).map(r=>(r.date||"")+"#"+r.side))].forEach(k=>{const[d,sd]=k.split("#");const pick=m=>rows.find(r=>r.tid===tid&&(r.date||"")===d&&r.side===sd&&normKey(r.metric)===m);
    const H=pick("altura de rebote"),C=pick("tiempo de contacto");if(H&&C&&!pick("rsi altura contacto")&&num(C.value)>0)rows.push({tid,test:T[tid].n,side:sd,src:"manual",metric:"RSI (altura/contacto)",unit:"m/s",value:String(Math.round(num(H.value)/100/(num(C.value)/1000)*100)/100),note:"calculado: altura (m) / contacto (s)",...(d?{date:d}:{})})})});
  if(!rows.length){out.textContent="Agrega al menos un resultado con valor numérico antes de guardar.";out.className="status err";return}
  btn.disabled=true;out.textContent="Guardando…";out.className="status";
  try{
    let files=(F.keepFiles||[]).slice();
    if(F.files.length&&assets){for(const x of F.files){if(!x.file)continue;try{const up=await assets.upload(x.file);files.push({name:x.file.name,asset:up.id,url:up.url})}catch(err){files.push({name:x.file.name})}}}
    else F.files.forEach(x=>x.file&&files.push({name:x.file.name}));
    const byDate={};rows.forEach(r=>{const d=F.id?F.date:(r.date||F.date||today());(byDate[d]=byDate[d]||[]).push(r)});
    const ds=Object.keys(byDate).sort();let lastId=null;
    for(const d of ds){const doc={pid:F.pid,date:d,zona:F.zona||"",tipo:F.tipo||"",folder:F.folder,mass:F.mass,ctx:F.ctx,rows:byDate[d],files,report:F.id?F.report:null,created:F.created||Date.now()};
      const same=S.evals.find(x=>x.pid===F.pid&&x.date===d&&x.id!==F.id);
      if(same){const own=F.id?S.evals.find(x=>x.id===F.id):null;
        await put("e",same.id,mergeEvalDoc(same,own?{...doc,report:null}:doc));if(F.id&&ds.length===1)await del("e",F.id);lastId=same.id}
      else{const eid=(F.id&&ds.length===1)?F.id:uidgen();await put("e",eid,doc);lastId=eid}}
    if(F.agendaId){const ag=S.agenda.find(x=>x.id===F.agendaId);if(ag){const rec={...ag,done:true,eid:lastId};delete rec.id;try{await put("a",ag.id,rec)}catch(e){}}}
    S.form=null;S.eid=lastId;S.rep=null;S.msg="";render();window.scrollTo(0,0);
  }catch(err){btn.disabled=false;out.textContent=errText(err);out.className="status err"}
}

  if(n!==(e.ctx||{}).notes){const rec={...e,ctx:{...(e.ctx||{}),notes:n}};delete rec.id;try{await put("e",e.id,rec);e.ctx=rec.ctx}catch(err){}}}

  const rep={};REP.forEach(([k])=>rep[k]=S.rep[k]||"");const rec={...e,ctx:{...(e.ctx||{}),notes:n},report:rep};delete rec.id;

const errText=err=>{const c=err&&err.code;return c==="quota_exceeded"?"Se alcanzó el límite de almacenamiento: borra evaluaciones antiguas.":c==="invalid_argument"?"Esta vista no tiene permiso para guardar.":"No se pudo guardar. Intenta de nuevo en unos segundos."};
